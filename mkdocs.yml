site_name: Practical Machine Learning in HEP
site_description: Un laboratorio de física y redes neuronales con CERN Open Data y el clúster Yuca.
site_url: https://castaned.github.io/practical-ml-hep/
repo_url: https://github.com/castaned/practical-ml-hep
repo_name: Material del curso
copyright: Taller MLforHEP · Universidad de Sonora · Cómputo en ACARUS / Yuca
strict: true
theme:
  name: material
  language: es
  font: false
  icon:
    logo: material/atom
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang: es
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - footnotes
  - attr_list
  - md_in_html
extra_css:
  - stylesheets/course.css?v=3
extra_javascript:
  - javascripts/explorer.js
  - javascripts/results.js
nav:
  - Inicio: index.md
  - Preparación inicial: preparacion.md
  - "1. ATLAS: clasificación del Higgs":
      - Procesos y variables: fisica.md
      - Benchmark: laboratorio.md
      - Variaciones y resultados: variaciones.md
      - Conclusiones: conclusiones.md
  - "2. CMS: autoencoder desde NanoAOD":
      - Datos, procesamiento y entrenamiento: autoencoder.md
  - Preparación y apoyo:
      - Bitácora ATLAS: bitacora.md
      - Comandos ATLAS: apoyo.md
      - Método y benchmarks ATLAS: referencia.md
      - Más preguntas ATLAS: preguntas-extra.md
  - Material complementario CMS:
      - Clasificación de cuatro leptones: cms-clasificacion.md
      - Variaciones de los ejemplos CMS: cms-experimentos.md
