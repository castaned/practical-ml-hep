site_name: Practical Machine Learning for HEP Data Analysis
site_description: Un laboratorio de física y redes neuronales con CERN Open Data y el clúster Yuca.
site_url: https://castaned.github.io/practical-ml-hep/
repo_url: https://github.com/castaned/practical-ml-hep
repo_name: Material del curso
copyright: Taller MLforHEP · Universidad de Sonora · Cómputo en ACARUS / Yuca
strict: true
theme:
  name: material
  language: es
  font: false
  icon:
    logo: material/atom
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang: es
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - footnotes
  - attr_list
  - md_in_html
extra_css:
  - stylesheets/course.css?v=16
extra_javascript:
  - javascripts/explorer.js?v=6
  - javascripts/scenarios.js?v=6
  - javascripts/simple-records.js?v=3
nav:
  - Introducción: index.md
  - Activación de cuenta (Yuca): preparacion.md
  - Taller Machine learning:
      - ATLAS:
          - Introducción: atlas.md
          - Procesos y variables: fisica.md
          - Preparar el entorno: atlas-preparacion.md
          - Benchmark: laboratorio.md
          - Variaciones y resultados: variaciones.md
          - Conclusiones: conclusiones.md
      - CMS:
          - Introducción: autoencoder.md
          - Física y objetivo: cms-fisica.md
          - Procesamiento NanoAOD: cms-procesamiento.md
          - Autoencoder y benchmark: cms-autoencoder.md
          - Interpretación y perspectivas: cms-resultados.md
  - Taller de ROOT: curso-root.md
  - Cambiar de taller: ambientes.md
  - Recursos y contacto: recursos.md
