<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="425" viewBox="0 0 1600 425" role="img" aria-labelledby="title desc"><title id="title">Flujo de análisis de datos en física de partículas</title><desc id="desc">Cinco módulos: fuente de datos, procesamiento en Yuca, observables, entrenamiento de redes neuronales e interpretación. El software ML-integration-CMSSW conecta las etapas mediante configuraciones YAML.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#8ca0af" stroke-width="1.7"/></marker></defs><rect x="1" y="1" width="1598" height="423" rx="20" fill="#ffffff" stroke="#dce5e7"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="43" font-size="21" fill="#29455f" font-weight="600">FLUJO DE ANÁLISIS EN FÍSICA DE PARTÍCULAS</text><text x="40" y="77" font-size="24" fill="#486170" font-weight="400">De los datos de origen a la interpretación de resultados</text><rect x="40" y="114" width="280" height="202" rx="14" fill="#eaf2fc" stroke="#27659c" stroke-width="2.2"/><rect x="40" y="132" width="5" height="166" rx="2" fill="#27659c"/><text x="61" y="151" font-size="16" fill="#27659c" font-weight="600">01 / DATOS</text><g transform="translate(259 133)" fill="none" stroke="#27659c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="21" cy="9" rx="16" ry="6"/><path d="M5 9v24c0 8 32 8 32 0V9M5 21c0 8 32 8 32 0"/></g><text x="61" y="211" font-size="24" fill="#1c3545" font-weight="600">CERN Open Data</text><text x="61" y="250" font-size="17" fill="#1c3545" font-weight="400">Eventos o tablas de variables</text><text x="61" y="279" font-size="17" fill="#1c3545" font-weight="400">Simulaciones ATLAS y CMS</text><circle cx="293" cy="295" r="4" fill="#27659c"/><rect x="350" y="114" width="280" height="202" rx="14" fill="#fff3da" stroke="#9a651a" stroke-width="2.2"/><rect x="350" y="132" width="5" height="166" rx="2" fill="#9a651a"/><text x="371" y="151" font-size="16" fill="#9a651a" font-weight="600">02 / CÓMPUTO</text><g transform="translate(569 133)" fill="none" stroke="#9a651a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="36" height="14" rx="3"/><rect x="3" y="24" width="36" height="14" rx="3"/><path d="M9 11h2m5 0h15M9 31h2m5 0h15"/></g><text x="371" y="211" font-size="24" fill="#1c3545" font-weight="600">Procesamiento</text><text x="371" y="250" font-size="17" fill="#1c3545" font-weight="400">Preparación y selección</text><text x="371" y="279" font-size="17" fill="#1c3545" font-weight="400">Yuca · ACARUS / UNISON</text><circle cx="603" cy="295" r="4" fill="#9a651a"/><rect x="660" y="114" width="280" height="202" rx="14" fill="#f0edfc" stroke="#6451a4" stroke-width="2.2"/><rect x="660" y="132" width="5" height="166" rx="2" fill="#6451a4"/><text x="681" y="151" font-size="16" fill="#6451a4" font-weight="600">03 / OBSERVABLES</text><g transform="translate(879 133)" fill="none" stroke="#6451a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v34h34M12 30V19m10 11V8m10 22V14"/></g><text x="681" y="211" font-size="24" fill="#1c3545" font-weight="600">Variables físicas</text><text x="681" y="250" font-size="17" fill="#1c3545" font-weight="400">Distribuciones y correlaciones</text><text x="681" y="279" font-size="17" fill="#1c3545" font-weight="400">Entradas del modelo</text><circle cx="913" cy="295" r="4" fill="#6451a4"/><rect x="970" y="114" width="280" height="202" rx="14" fill="#e2f5ef" stroke="#087f85" stroke-width="2.2"/><rect x="970" y="132" width="5" height="166" rx="2" fill="#087f85"/><text x="991" y="151" font-size="16" fill="#087f85" font-weight="600">04 / APRENDIZAJE</text><g transform="translate(1189 133)" fill="none" stroke="#087f85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l14 13L7 34m14-13L35 8M21 21l14 13"/><circle cx="7" cy="8" r="4"/><circle cx="7" cy="34" r="4"/><circle cx="21" cy="21" r="4"/><circle cx="35" cy="8" r="4"/><circle cx="35" cy="34" r="4"/></g><text x="991" y="211" font-size="24" fill="#1c3545" font-weight="600">Red neuronal</text><text x="991" y="250" font-size="17" fill="#1c3545" font-weight="400">Entrenamiento y validación</text><text x="991" y="279" font-size="17" fill="#1c3545" font-weight="400">Clasificación o reconstrucción</text><circle cx="1223" cy="295" r="4" fill="#087f85"/><rect x="1280" y="114" width="280" height="202" rx="14" fill="#edf2f7" stroke="#29455f" stroke-width="2.2"/><rect x="1280" y="132" width="5" height="166" rx="2" fill="#29455f"/><text x="1301" y="151" font-size="16" fill="#29455f" font-weight="600">05 / RESULTADOS</text><g transform="translate(1499 133)" fill="none" stroke="#29455f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v34h34M10 28l9-9 8 4 10-14M31 9h6v6"/></g><text x="1301" y="211" font-size="24" fill="#1c3545" font-weight="600">Interpretación</text><text x="1301" y="250" font-size="17" fill="#1c3545" font-weight="400">Comparación de modelos</text><text x="1301" y="279" font-size="17" fill="#1c3545" font-weight="400">Conclusiones físicas</text><circle cx="1533" cy="295" r="4" fill="#29455f"/><path d="M325 215 H342" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><path d="M635 215 H652" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><path d="M945 215 H962" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><path d="M1255 215 H1272" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="345" width="1520" height="49" rx="10" fill="#142d40"/><text x="62" y="376" font-size="19" fill="#e5f2f3" font-weight="500">Yuca · ACARUS / UNISON: recursos de CPU y GPU</text><text x="795" y="376" font-size="19" fill="#b9e4d9" font-weight="500">ML-integration-CMSSW: análisis configurable mediante YAML</text></g></svg>