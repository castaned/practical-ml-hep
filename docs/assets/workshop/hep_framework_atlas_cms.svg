<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="770" viewBox="0 0 1760 770" role="img" aria-labelledby="title desc"><title id="title">Arquitectura de análisis: CERN Open Data, Yuca y los ejercicios ATLAS y CMS</title><desc id="desc">CERN Open Data aporta una tabla CSV de ATLAS y archivos NanoAOD de CMS. Dentro de Yuca se prepara la tabla y se entrena un clasificador para ATLAS; se seleccionan eventos, se calculan variables, se convierten a HDF5 y se entrena un autoencoder para CMS. Un marco verde destaca entrenamiento y evaluación ATLAS; uno violeta enmarca procesamiento y entrenamiento CMS. El software común es ML-integration-CMSSW, configurable mediante YAML.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#7893a6" stroke-width="1.6"/></marker><pattern id="stripes" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V18" stroke="#087f85" stroke-width="3" opacity=".05"/></pattern></defs><rect width="1760" height="770" rx="20" fill="#fff"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="300" y="24" width="1430" height="720" rx="42" fill="#fff4df" stroke="#c89936" stroke-width="2.5" stroke-dasharray="16 11"/><text x="337" y="75" text-anchor="start" font-size="31" fill="#5d4723" font-weight="600"><tspan x="337" dy="0">YUCA</tspan></text><text x="470" y="74" text-anchor="start" font-size="22" fill="#6c5b3a" font-weight="400"><tspan x="470" dy="0">ACARUS · UNISON · Recursos CPU / GPU</tspan></text><rect x="30" y="173" width="235" height="469" rx="38" fill="#e9f0fa" stroke="#6d91b9" stroke-width="2"/><text x="147" y="212" text-anchor="middle" font-size="26" fill="#2b507c" font-weight="600"><tspan x="147" dy="0">CERN</tspan><tspan x="147" dy="31">Open Data</tspan></text><text x="147" y="286" text-anchor="middle" font-size="19" fill="#2b507c" font-weight="600"><tspan x="147" dy="0">ATLAS</tspan></text><path d="M77 318 C77 298.0 218 298.0 218 318 V390 C218 410.0 77 410.0 77 390 Z" fill="#ffffff" stroke="#7893a6" stroke-width="2"/><path d="M77 318 C77 337.5 218 337.5 218 318" fill="none" stroke="#7893a6" stroke-width="2"/><text x="147.5" y="353" text-anchor="middle" font-size="18" fill="#263d50" font-weight="400"><tspan x="147.5" dy="0">Tabla CSV</tspan></text><text x="147" y="503" text-anchor="middle" font-size="19" fill="#66509a" font-weight="600"><tspan x="147" dy="0">CMS</tspan></text><path d="M77 535 C77 515.0 218 515.0 218 535 V607 C218 627.0 77 627.0 77 607 Z" fill="#ffffff" stroke="#7893a6" stroke-width="2"/><path d="M77 535 C77 554.5 218 554.5 218 535" fill="none" stroke="#7893a6" stroke-width="2"/><text x="147.5" y="570" text-anchor="middle" font-size="18" fill="#263d50" font-weight="400"><tspan x="147.5" dy="0">NanoAOD</tspan><tspan x="147.5" dy="24">(.root)</tspan></text><rect x="972" y="140" width="718" height="239" rx="28" fill="#e1f3ed" stroke="#087f85" stroke-width="2.5" stroke-dasharray="12 8"/><rect x="972" y="140" width="718" height="239" rx="28" fill="url(#stripes)"/><text x="996" y="179" text-anchor="start" font-size="23" fill="#087f85" font-weight="600"><tspan x="996" dy="0">ATLAS · Entrenamiento y evaluación</tspan></text><rect x="330" y="435" width="1360" height="219" rx="28" fill="#ece8fa" stroke="#7b66aa" stroke-width="2.5" stroke-dasharray="12 8"/><text x="354" y="472" text-anchor="start" font-size="23" fill="#66509a" font-weight="600"><tspan x="354" dy="0">CMS · Procesamiento y entrenamiento</tspan></text><path d="M226 354H282V286H351" stroke="#7893a6" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M550 286 H591" stroke="#7893a6" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M764 286 H990" stroke="#7893a6" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1199 286 H1221" stroke="#7893a6" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1399 286 H1441" stroke="#7893a6" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M360 244 H522 L545 286.0 L522 328 H360 L383 286.0 Z" fill="#fff" stroke="#7893a6" stroke-width="2"/><text x="452.5" y="293.0" text-anchor="middle" font-size="19" fill="#263d50" font-weight="500"><tspan x="452.5" dy="0">Preparación</tspan></text><path d="M600 250 C600 230.0 755 230.0 755 250 V322 C755 342.0 600 342.0 600 322 Z" fill="#ffffff" stroke="#7893a6" stroke-width="2"/><path d="M600 250 C600 269.5 755 269.5 755 250" fill="none" stroke="#7893a6" stroke-width="2"/><text x="677.5" y="285" text-anchor="middle" font-size="18" fill="#263d50" font-weight="400"><tspan x="677.5" dy="0">30 variables</tspan></text><path d="M1000 244 H1167 L1190 286.0 L1167 328 H1000 L1023 286.0 Z" fill="#fff" stroke="#087f85" stroke-width="2"/><text x="1095.0" y="293.0" text-anchor="middle" font-size="19" fill="#263d50" font-weight="500"><tspan x="1095.0" dy="0">Clasificador</tspan></text><path d="M1230 250 C1230 230.0 1390 230.0 1390 250 V322 C1390 342.0 1230 342.0 1230 322 Z" fill="#ffffff" stroke="#087f85" stroke-width="2"/><path d="M1230 250 C1230 269.5 1390 269.5 1390 250" fill="none" stroke="#087f85" stroke-width="2"/><text x="1310.0" y="285" text-anchor="middle" font-size="18" fill="#263d50" font-weight="400"><tspan x="1310.0" dy="0">Modelo</tspan><tspan x="1310.0" dy="24">y gráficos</tspan></text><path d="M1450 235 L1665 286.0 L1450 337 Z" fill="#fff" stroke="#7893a6" stroke-width="2"/><text x="1482" y="278" text-anchor="start" font-size="18" fill="#263d50" font-weight="400"><tspan x="1482" dy="0">Evaluación</tspan><tspan x="1482" dy="25">ROC / AMS</tspan></text><text x="680" y="358" text-anchor="middle" font-size="18" fill="#6c5b3a" font-weight="400"><tspan x="680" dy="0">Variables preparadas</tspan></text><path d="M226 571H281V546H341" stroke="#7893a6" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M522 546 H541" stroke="#7893a6" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M688 546 H706"