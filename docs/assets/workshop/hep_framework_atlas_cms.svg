ddle" font-size="19" fill="#263d50" font-weight="500"><tspan x="1157.5" dy="0">Autoencoder</tspan></text><path d="M1285 510 C1285 490.0 1430 490.0 1430 510 V582 C1430 602.0 1285 602.0 1285 582 Z" fill="#ffffff" stroke="#7893a6" stroke-width="2"/><path d="M1285 510 C1285 529.5 1430 529.5 1430 510" fill="none" stroke="#7893a6" stroke-width="2"/><text x="1357.5" y="545" text-anchor="middle" font-size="18" fill="#263d50" font-weight="400"><tspan x="1357.5" dy="0">Modelo</tspan><tspan x="1357.5" dy="24">y gráficos</tspan></text><path d="M1465 495 L1665 546.0 L1465 597 Z" fill="#fff" stroke="#7893a6" stroke-width="2"/><text x="1497" y="538" text-anchor="start" font-size="18" fill="#263d50" font-weight="400"><tspan x="1497" dy="0">Evaluación</tspan><tspan x="1497" dy="25">MSE / W′</tspan></text><rect x="330" y="685" width="1360" height="38" rx="10" fill="#173449"/><text x="1010" y="711" text-anchor="middle" font-size="21" fill="#e5f3f3" font-weight="500"><tspan x="1010" dy="0">ML-integration-CMSSW · Configuración de los procesos mediante archivos YAML</tspan></text></g></svg>