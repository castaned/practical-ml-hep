<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="795" viewBox="0 0 1600 795" role="img" aria-labelledby="title desc"><title id="title">Dos aplicaciones del mismo flujo: ATLAS Higgs y CMS anomalías</title><desc id="desc">En ATLAS se enfatiza el entrenamiento de un clasificador a partir de variables ya preparadas. En CMS se enfatizan el procesamiento de NanoAOD y el entrenamiento del autoencoder. Las etapas resaltadas indican el énfasis de cada ejercicio; las demás permanecen visibles.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#8ca0af" stroke-width="1.7"/></marker></defs><rect x="1" y="1" width="1598" height="793" rx="20" fill="#ffffff" stroke="#dce5e7"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="40" font-size="21" fill="#29455f" font-weight="600">DOS EJERCICIOS · UN MISMO FLUJO DE ANÁLISIS</text><text x="40" y="83" font-size="29" fill="#27659c" font-weight="600">ATLAS · Higgs Challenge</text><text x="720" y="80" font-size="21" fill="#087f85" font-weight="600">Énfasis: entrenamiento del clasificador</text><rect x="40" y="112" width="280" height="202" rx="14" fill="#f5f7f9" stroke="#dce3e9" stroke-width="1"/><text x="61" y="149" font-size="16" fill="#657582" font-weight="600">01 / DATOS</text><g transform="translate(259 131)" fill="none" stroke="#9cabb6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="21" cy="9" rx="16" ry="6"/><path d="M5 9v24c0 8 32 8 32 0V9M5 21c0 8 32 8 32 0"/></g><text x="61" y="209" font-size="24" fill="#5e6c79" font-weight="600">CSV comprimido</text><text x="61" y="248" font-size="17" fill="#5e6c79" font-weight="400">30 variables físicas</text><text x="61" y="277" font-size="17" fill="#5e6c79" font-weight="400">Señal y fondo etiquetados</text><rect x="350" y="112" width="280" height="202" rx="14" fill="#f5f7f9" stroke="#dce3e9" stroke-width="1"/><text x="371" y="149" font-size="16" fill="#657582" font-weight="600">02 / CÓMPUTO</text><g transform="translate(569 131)" fill="none" stroke="#9cabb6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="36" height="14" rx="3"/><rect x="3" y="24" width="36" height="14" rx="3"/><path d="M9 11h2m5 0h15M9 31h2m5 0h15"/></g><text x="371" y="209" font-size="24" fill="#5e6c79" font-weight="600">Preparación</text><text x="371" y="248" font-size="17" fill="#5e6c79" font-weight="400">Valores ausentes y escalado</text><text x="371" y="277" font-size="17" fill="#5e6c79" font-weight="400">Procesamiento en Yuca</text><rect x="660" y="112" width="280" height="202" rx="14" fill="#f5f7f9" stroke="#dce3e9" stroke-width="1"/><text x="681" y="149" font-size="16" fill="#657582" font-weight="600">03 / OBSERVABLES</text><g transform="translate(879 131)" fill="none" stroke="#9cabb6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v34h34M12 30V19m10 11V8m10 22V14"/></g><text x="681" y="209" font-size="24" fill="#5e6c79" font-weight="600">Entradas de la red</text><text x="681" y="248" font-size="17" fill="#5e6c79" font-weight="400">Variables ya calculadas</text><text x="681" y="277" font-size="17" fill="#5e6c79" font-weight="400">Distribuciones señal / fondo</text><rect x="970" y="112" width="280" height="202" rx="14" fill="#e2f5ef" stroke="#087f85" stroke-width="2.2"/><rect x="970" y="130" width="5" height="166" rx="2" fill="#087f85"/><text x="991" y="149" font-size="16" fill="#087f85" font-weight="600">04 / APRENDIZAJE</text><g transform="translate(1189 131)" fill="none" stroke="#087f85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l14 13L7 34m14-13L35 8M21 21l14 13"/><circle cx="7" cy="8" r="4"/><circle cx="7" cy="34" r="4"/><circle cx="21" cy="21" r="4"/><circle cx="35" cy="8" r="4"/><circle cx="35" cy="34" r="4"/></g><text x="991" y="209" font-size="24" fill="#1c3545" font-weight="600">Clasificador</text><text x="991" y="248" font-size="17" fill="#1c3545" font-weight="400">Capas, neuronas y ajuste</text><text x="991" y="277" font-size="17" fill="#1c3545" font-weight="400">Entrenamiento CPU / GPU</text><circle cx="1223" cy="293" r="4" fill="#087f85"/><rect x="1280" y="112" width="280" height="202" rx="14" fill="#f5f7f9" stroke="#dce3e9" stroke-width="1"/><text x="1301" y="149" font-size="16" fill="#657582" font-weight="600">05 / RESULTADOS</text><g transform="translate(1499 131)" fill="none" stroke="#9cabb6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v34h34M10 28l9-9 8 4 10-14M31 9h6v6"/></g><text x="1301" y="209" font-size="24" fill="#5e6c79" font-weight="600">Interpretación</text><text x="1301" y="248" font-size="17" fill="#5e6c79" font-weight="400">ROC, AUC y AMS interna</text><text x="1301" y="277" font-size="17" fill="#5e6c79" font-weight="400">Comparación con la referencia</text><path d="M325 213 H342" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><path d="M635 213 H652" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><path d="M945 213 H962" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><path d="M1255 213 H1272" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><text x="42" y="350" font-size="20" fill="#486170" font-weight="400">Las variables vienen preparadas: el ejercicio se concentra en reproducir el benchmark y comparar sus variaciones.</text><path d="M40 383H1560" stroke="#dce5e7"/><text x="40" y="431" font-size="29" fill="#6451a4" font-weight="600">CMS · Búsqueda de anomalías</text><text x="720" y="428" font-size="21" fill="#087f85" font-weight="600">Énfasis: procesamiento y entrenamiento</text><rect x="40" y="460" width="280" height="202" rx="14" fill="#f5f7f9" stroke="#dce3e9" stroke-width="1"/><text x="61" y="497" font-size="16" fill="#657582" font-weight="600">01 / DATOS</text><g transform="translate(259 479)" fill="none" stroke="#9cabb6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="21" cy="9" rx="16" ry="6"/><path d="M5 9v24c0 8 32 8 32 0V9M5 21c0 8 32 8 32 0"/></g><text x="61" y="557" font-size="24" fill="#5e6c79" font-weight="600">NanoAOD / ROOT</text><text x="61" y="596" font-size="17" fill="#5e6c79" font-weight="400">Colecciones de partículas</text><text x="61" y="625" font-size="17" fill="#5e6c79" font-weight="400">Simulación multileptónica</text><rect x="350" y="460" width="280" height="202" rx="14" fill="#fff3da" stroke="#9a651a" stroke-width="2.2"/><rect x="350" y="478" width="5" height="166" rx="2" fill="#9a651a"/><text x="371" y="497" font-size="16" fill="#9a651a" font-weight="600">02 / CÓMPUTO</text><g transform="translate(569 479)" fill="none" stroke="#9a651a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="36" height="14" rx="3"/><rect x="3" y="24" width="36" height="14" rx="3"/><path d="M9 11h2m5 0h15M9 31h2m5 0h15"/></g><text x="371" y="557" font-size="24" fill="#1c3545" font-weight="600">Procesamiento</text><text x="371" y="596" font-size="17" fill="#1c3545" font-weight="400">Selección y candidatos W/Z</text><text x="371" y="625" font-size="17" fill="#1c3545" font-weight="400">Extracción de variables</text><circle cx="603" cy="641" r="4" fill="#9a651a"/><rect x="660" y="460" width="280" height="202" rx="14" fill="#f5f7f9" stroke="#dce3e9" stroke-width="1"/><text x="681" y="497" font-size="16" fill="#657582" font-weight="600">03 / OBSERVABLES</text><g transform="translate(879 479)" fill="none" stroke="#9cabb6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v34h34M12 30V19m10 11V8m10 22V14"/></g><text x="681" y="557" font-size="24" fill="#5e6c79" font-weight="600">Datos para la red</text><text x="681" y="596" font-size="17" fill="#5e6c79" font-weight="400">Observables en HDF5</text><text x="681" y="625" font-size="17" fill="#5e6c79" font-weight="400">Distribuciones de control</text><rect x="970" y="460" width="280" height="202" rx="14" fill="#e2f5ef" stroke="#087f85" stroke-width="2.2"/><rect x="970" y="478" width="5" height="166" rx="2" fill="#087f85"/><text x="991" y="497" font-size="16" fill="#087f85" font-weight="600">04 / APRENDIZAJE</text><g transform="translate(1189 479)" fill="none" stroke="#087f85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l14 13L7 34m14-13L35 8M21 21l14 13"/><circle cx="7" cy="8" r="4"/><circle cx="7" cy="34" r="4"/><circle cx="21" cy="21" r="4"/><circle cx="35" cy="8" r="4"/><circle cx="35" cy="34" r="4"/></g><text x="991" y="557" font-size="24" fill="#1c3545" font-weight="600">Autoencoder</text><text x="991" y="596" font-size="17" fill="#1c3545" font-weight="400">Aprender a reconstruir</text><text x="991" y="625" font-size="17" fill="#1c3545" font-weight="400">Entrenamiento con el SM</text><circle cx="1223" cy="641" r="4" fill="#087f85"/><rect x="1280" y="460" width="280" height="202" rx="14" fill="#f5f7f9" stroke="#dce3e9" stroke-width="1"/><text x="1301" y="497" font-size="16" fill="#657582" font-weight="600">05 / RESULTADOS</text><g transform="translate(1499 479)" fill="none" stroke="#9cabb6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v34h34M10 28l9-9 8 4 10-14M31 9h6v6"/></g><text x="1301" y="557" font-size="24" fill="#5e6c79" font-weight="600">Interpretación</text><text x="1301" y="596" font-size="17" fill="#5e6c79" font-weight="400">Error de reconstrucción</text><text x="1301" y="625" font-size="17" fill="#5e6c79" font-weight="400">Evaluación con W′</text><path d="M325 561 H342" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><path d="M635 561 H652" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><path d="M945 561 H962" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><path d="M1255 561 H1272" fill="none" stroke="#8ca0af" stroke-width="2" marker-end="url(#arrow)"/><text x="42" y="699" font-size="20" fill="#486170" font-weight="400">Se parte de los eventos: el procesamiento construye las variables que después utilizará el autoencoder.</text><rect x="40" y="731" width="16" height="16" rx="4" fill="#e2f5ef" stroke="#087f85" stroke-width="2"/><text x="67" y="745" font-size="18" fill="#486170" font-weight="400">Color y contorno: etapas con mayor énfasis en cada ejercicio. El flujo completo se conserva.</text></g></svg>