<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="440" viewBox="0 0 1420 440" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">Flujo de análisis de datos en física experimental de partículas</title>
<desc id="flow-desc">Una fuente de datos se procesa en Yuca para obtener observables y selecciones. Estos permiten analizar distribuciones y extraer conclusiones. Opcionalmente, los observables se utilizan para entrenar una red neuronal, cuya evaluación también contribuye a la interpretación. Ambos recorridos se practican con simulaciones de CERN Open Data.</desc>
