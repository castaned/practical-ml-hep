<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="950" viewBox="0 0 1760 950" role="img" aria-labelledby="title desc">
<title id="title">Procesamiento de datos y machine learning en ATLAS y CMS sobre Yuca</title>
<desc id="desc">Los cilindros representan archivos almacenados y los rectángulos operaciones. ATLAS recibe treinta variables calculadas, prepara particiones y escalado, entrena un clasificador y evalúa en validación interna. CMS procesa NanoAOD y produce observables HDF5, prepara particiones y escalado con SM de entrenamiento, entrena un autoencoder solo con SM y evalúa con SM de prueba y Wprime. Cada cuenta conserva sus modelos, métricas y figuras. CERN Open Data es la fuente pública y Yuca el entorno de cómputo.</desc>
