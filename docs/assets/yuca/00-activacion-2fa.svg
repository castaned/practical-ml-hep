<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="265" viewBox="0 0 1100 265" role="img" aria-labelledby="title"><title id="title">Activación de la doble verificación: QR de Yuca, escaneo en Authenticator y código temporal</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#087f85"/></marker></defs><rect width="1100" height="265" rx="20" fill="#f0f6f7"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="25" y="30" width="310" height="200" rx="16" fill="#fff" stroke="#b7cbd2"/><rect x="395" y="30" width="310" height="200" rx="16" fill="#e0f5ed" stroke="#087f85"/><rect x="765" y="30" width="310" height="200" rx="16" fill="#fff" stroke="#b7cbd2"/><g fill="#173449" font-size="24" font-weight="700"><text x="180" y="73">1 · Computadora</text><text x="550" y="73">2 · Teléfono</text><text x="920" y="73">3 · Verificación</text></g><g fill="#355568" font-size="20"><text x="180" y="121">Yuca muestra tu QR</text><text x="180" y="152">durante el primer SSH</text><text x="550" y="121">Google Authenticator</text><text x="550" y="152">+ → Escanear código QR</text><text x="920" y="121">Código temporal</text><text x="920" y="152">de seis dígitos</text></g><g font-size="16" fill="#087f85"><text x="180" y="199">Es personal de tu cuenta</text><text x="550" y="199">Apunta al QR de la computadora</text><text x="920" y="199">Introdúcelo cuando se solicite</text></g></g><g stroke="#087f85" stroke-width="3" marker-end="url(#arrow)"><path d="M345 130H383"/><path d="M715 130H753"/></g></svg>